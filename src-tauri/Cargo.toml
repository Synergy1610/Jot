[package]
name = "jot"
version = "0.1.0"
description = "A summoned scratchpad"
edition = "2021"

[lib]
name = "jot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# T-005: enable tauri-plugin-sql with the "sqlite" feature when the local store is built.
