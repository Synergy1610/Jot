<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4d8e2"/>
      <stop offset="100%" stop-color="#b59790"/>
    </linearGradient>
  </defs>

  <!-- rounded dark tile, Last Horizon dark_background -->
  <rect width="512" height="512" rx="112" fill="#090809"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#584e51" stroke-width="4"/>

  <!-- top bar of the J -->
  <path d="M168 104 H344" stroke="#b59790" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- fountain-pen nib forming the upper half of the J -->
  <path d="M256 112
           C212 112 184 132 184 158
           C184 186 216 226 248 250
           L256 256 L264 250
           C296 226 328 186 328 158
           C328 132 300 112 256 112 Z"
        fill="url(#nib)"/>
  <path d="M256 152 V248" stroke="#090809" stroke-width="7" stroke-linecap="round"/>
  <circle cx="256" cy="168" r="9" fill="#090809"/>
  <path d="M214 152 C222 186 238 212 250 226" stroke="#584e51" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M298 152 C290 186 274 212 262 226" stroke="#584e51" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- lower half of the J: stem and hook -->
  <path d="M256 256 V372 C256 412 228 436 188 436 C158 436 138 420 130 398"
        stroke="#b59790" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
