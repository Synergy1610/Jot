<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4d8e2"/>
      <stop offset="100%" stop-color="#b59790"/>
    </linearGradient>
  </defs>

  <!-- rounded dark tile, Last Horizon dark_background -->
  <rect width="512" height="512" rx="112" fill="#090809"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#584e51" stroke-width="4"/>

  <!-- slim fountain-pen nib: long, sharp point at the top -->
  <path d="M276 48
           L312 186
           C315 204 304 214 288 214
           L264 214
           C248 214 237 204 240 186 Z"
        fill="url(#nib)"/>
  <path d="M276 66 V200" stroke="#090809" stroke-width="5" stroke-linecap="butt"/>
  <circle cx="276" cy="196" r="7" fill="#090809"/>
  <path d="M252 182 L270 88" stroke="#584e51" stroke-width="4" fill="none" stroke-linecap="butt"/>
  <path d="M300 182 L282 88" stroke="#584e51" stroke-width="4" fill="none" stroke-linecap="butt"/>

  <!-- bold J: the pen body, smooth hook and a squared-off end -->
  <path d="M276 212 V352 C276 408 244 436 190 436 L160 436"
        stroke="#b59790" stroke-width="46" fill="none"
        stroke-linecap="butt" stroke-linejoin="miter"/>
</svg>
