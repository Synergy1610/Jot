name: Android

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "JOT_VERSION=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          else
            echo "JOT_VERSION=dev-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "JOT_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          JOT_KEYSTORE_B64: ${{ secrets.JOT_KEYSTORE_B64 }}
        run: |
          if [ -n "$JOT_KEYSTORE_B64" ]; then
            echo "$JOT_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "JOT_KEYSTORE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
          else
            echo "No JOT_KEYSTORE_B64 secret; the APK will be debug-signed."
          fi

      - name: Unit tests
        working-directory: native/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble APK
        working-directory: native/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          JOT_KEYSTORE_PASSWORD: ${{ secrets.JOT_KEYSTORE_PASSWORD }}
          JOT_KEY_ALIAS: ${{ secrets.JOT_KEY_ALIAS }}
          JOT_KEY_PASSWORD: ${{ secrets.JOT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp native/android/app/build/outputs/apk/release/app-release.apk \
             "out/jot-android-${JOT_VERSION}-arm64-v8a.apk"
          (cd out && sha256sum ./*.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: jot-android-${{ env.JOT_VERSION }}
          path: out/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          files: out/*
          name: Jot ${{ env.JOT_VERSION }}
          body: |
            Sideload APK for Jot on Android.

            Install with `adb install -r jot-android-${{ env.JOT_VERSION }}-arm64-v8a.apk`
            or by opening the file on the phone. Updates must be signed with the
            same key, so keep using this release channel.
